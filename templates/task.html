<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Plan Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Play CDN: dev/preview only. For production, build via Tailwind CLI / PostCSS. -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    html { background: #0a0e14; }
    body { font-feature-settings: "cv02","cv03","cv04","cv11"; }
    #plan-modal::backdrop { background: rgba(6,9,14,0.78); backdrop-filter: blur(2px); }
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .chev { transition: transform .18s ease; }
    details[open] > summary > .chev { transform: rotate(90deg); }
    .task-body { animation: reveal .15s ease; }
    @keyframes reveal { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #232b38; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #2d3747; }
    @media (prefers-reduced-motion: reduce) {
      .task-body { animation: none; }
      .chev { transition: none; }
    }
  </style>
</head>
<body class="bg-[#0a0e14] text-[#dde3ec] font-sans antialiased max-w-[1400px] mx-auto px-3 py-4 sm:px-6 sm:py-8 selection:bg-teal-500/30">
  <header class="flex gap-2 items-center flex-wrap mb-3 pb-3 border-b border-[#1c2431]">
    <div class="mr-auto sm:mr-2 flex items-baseline gap-2">
      <h1 class="text-base sm:text-[1.1rem] font-semibold tracking-tight text-white m-0">Project Plan Manager</h1>
      <span class="font-mono text-[11px] text-[#5b6577]">ppm</span>
    </div>
    <button id="refresh" class="order-2 sm:order-none text-[#dde3ec] bg-[#111720] border border-[#232b38] rounded-md px-3 py-1.5 text-xs sm:text-sm cursor-pointer hover:border-teal-500/50 hover:text-teal-300 transition-colors focus-visible:ring-2 focus-visible:ring-teal-500/60 outline-none">Refresh</button>
    <select id="project" aria-label="Project" class="order-3 sm:order-none w-full sm:w-auto min-w-0 sm:max-w-[420px] truncate text-[#dde3ec] bg-[#111720] border border-[#232b38] rounded-md px-2.5 py-1.5 text-xs sm:text-sm outline-none focus-visible:ring-2 focus-visible:ring-teal-500/60 hover:border-[#2d3747] transition-colors"></select>
    <select id="plan-filter" aria-label="Completion filter" class="order-4 sm:order-none text-[#dde3ec] bg-[#111720] border border-[#232b38] rounded-md px-2.5 py-1.5 text-xs sm:text-sm outline-none focus-visible:ring-2 focus-visible:ring-teal-500/60 hover:border-[#2d3747] transition-colors">
      <option value="all">All plans</option>
      <option value="zero">0%</option>
      <option value="partial">1–99%</option>
      <option value="complete">100%</option>
    </select>
    <input id="search" type="search" aria-label="Search tasks" placeholder="Search tasks, files, agent…" class="order-5 sm:order-none flex-1 min-w-0 sm:min-w-[240px] sm:flex-none text-[#dde3ec] placeholder:text-[#5b6577] bg-[#111720] border border-[#232b38] rounded-md px-2.5 py-1.5 text-xs sm:text-sm outline-none focus-visible:ring-2 focus-visible:ring-teal-500/60 hover:border-[#2d3747] transition-colors">
  </header>
  <main id="content" class="space-y-2">
    <p class="text-[#5b6577] text-sm">Loading…</p>
  </main>
  <dialog id="plan-modal" class="w-[min(900px,94vw)] max-h-[85vh] text-[#dde3ec] bg-[#0d1218] border border-[#232b38] rounded-xl p-0 shadow-2xl shadow-black/60">
    <div class="sticky top-0 flex items-center gap-3 px-3 sm:px-4 py-2.5 sm:py-3 bg-[#111720] border-b border-[#232b38] rounded-t-xl">
      <strong id="modal-title" class="mr-auto text-sm font-medium text-white truncate"></strong>
      <button id="modal-close" class="text-[#dde3ec] bg-[#181f2a] border border-[#232b38] rounded-md px-3 py-1.5 text-xs cursor-pointer hover:border-teal-500/50 hover:text-teal-300 transition-colors">Close</button>
    </div>
    <pre id="modal-content" class="p-3 sm:p-4 m-0 overflow-auto whitespace-pre-wrap text-[11px] sm:text-[12px] leading-relaxed font-mono text-[#c3ccd9]"></pre>
  </dialog>
  <script>
    // ============== state ==============
    const state = { data:null, project:"", query:"", filter:"all", open:new Map() };

    // ============== design tokens ==============
    const TASK_BORDER = {
      completed: "border-l-emerald-500",
      in_progress: "border-l-sky-400",
      fail: "border-l-rose-500",
      todo: "border-l-amber-400",
    };
    const TASK_DOT = {
      completed: "bg-emerald-500",
      in_progress: "bg-sky-400",
      fail: "bg-rose-500",
      todo: "bg-amber-400",
    };
    const TASK_BASE = "border-l-2 bg-[#111720] hover:bg-[#141b26] rounded-r-lg px-2.5 sm:px-3.5 py-1 my-1.5 sm:my-2 transition-colors";
    const BADGE_BASE = "inline-flex items-center gap-1 text-[10px] leading-4 font-semibold tracking-wide px-1.5 rounded-full border font-mono whitespace-nowrap";
    const BADGE_VARIANT = {
      ready: "text-emerald-300 bg-emerald-950/60 border-emerald-800/70",
      blocked: "text-amber-300 bg-amber-950/60 border-amber-800/70",
      stuck: "text-rose-300 bg-rose-950/60 border-rose-800/70",
      parallel: "text-sky-300 bg-sky-950/60 border-sky-800/70",
      waiting: "text-[#8996a8] bg-[#161d27] border-[#2d3747]",
      current: "text-teal-300 bg-teal-950/60 border-teal-800/70",
      agent: "text-violet-300 bg-violet-950/50 border-violet-800/60",
      wave: "text-[#8996a8] bg-transparent border-[#2d3747]",
    };
    const COMPLETION_VARIANT = {
      zero: { text: "text-[#8996a8]", bar: "bg-[#39424f]" },
      partial: { text: "text-amber-300", bar: "bg-amber-400" },
      complete: { text: "text-emerald-300", bar: "bg-emerald-500" },
    };
    const TITLE_VARIANT = {
      zero: "text-[#c3ccd9]",
      partial: "text-amber-100",
      complete: "text-emerald-100",
    };
    const MUTED = "text-[#8996a8] text-[12px] sm:text-[13px]";
    const META = "font-mono text-[10.5px] sm:text-[11px] text-[#6d7889]";
    const BUTTON = "text-[#c3ccd9] bg-[#161d27] border border-[#232b38] rounded-md px-2.5 sm:px-3 py-1.5 text-[11px] sm:text-xs font-medium cursor-pointer hover:border-teal-500/50 hover:text-teal-300 transition-colors";
    const BUTTON_PRIMARY = "text-[#0a0e14] bg-teal-400 border border-teal-400 rounded-md px-2.5 sm:px-3 py-1.5 text-[11px] sm:text-xs font-semibold cursor-pointer hover:bg-teal-300 transition-colors";
    const CHEVRON = `<svg class="chev w-3.5 h-3.5 mt-1 shrink-0 text-[#6d7889]" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    // ============== helpers ==============
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    }
    function cls(...parts) {
      return parts.filter(Boolean).join(" ");
    }
    const list = value => (Array.isArray(value) ? value : []);
    function rememberAccordions() {
      document.querySelectorAll("#content details[data-key]").forEach(item => state.open.set(item.dataset.key, item.open));
    }
    function stats(phases) {
      const tasks = phases.flatMap(phase => phase.tasks);
      const completed = tasks.filter(task => task.status === "completed").length;
      return { completed, total:tasks.length, percent:tasks.length ? Math.round(completed * 100 / tasks.length) : 0 };
    }
    function completionClass(value) {
      return value === 100 ? "complete" : value === 0 ? "zero" : "partial";
    }
    function titleClass(percent) {
      return TITLE_VARIANT[completionClass(percent)];
    }
    // Mirrors ppm plan_status: first phase that is not fully completed.
    function currentPhaseName(plan) {
      return plan.phases.find(phase => phase.tasks.some(task => task.status !== "completed"))?.name || null;
    }
    // Ascending completion; ties keep name order (server sorts by name).
    function byCompletion(a, b) {
      return a.percent - b.percent;
    }
    function isOpen(key, fallback) {
      return state.open.has(key) ? state.open.get(key) : fallback;
    }
    // Progress entries are appended as "[<ISO timestamp>] <text>" lines (ppm task_write_progress).
    // Evidence may span several lines, so split on the timestamp marker: untimestamped lines
    // continue the entry above. The legacy fail_desc marker (phase.js) is its own entry, never
    // a continuation, because it is appended after whatever progress already existed.
    const PROGRESS_ENTRY = /^\[(\d{4}-\d{2}-\d{2}T[\d:.]+Z)\]\s?/;
    const PROGRESS_LEGACY = /^\[legacy fail_desc\]/;
    function progressEntries(text) {
      const entries = [];
      String(text || "").split("\n").forEach(line => {
        const match = line.match(PROGRESS_ENTRY);
        if (match) entries.push({ stamp: match[1], text: line.slice(match[0].length) });
        else if (PROGRESS_LEGACY.test(line)) entries.push({ stamp: "", text: line });
        else if (entries.length) entries[entries.length - 1].text += `\n${line}`;
        else entries.push({ stamp: "", text: line });
      });
      return entries.filter(entry => entry.stamp || entry.text.trim());
    }

    // ============== primitive components ==============
    function Badge(variant, text, title) {
      const t = title ? ` title="${esc(title)}"` : "";
      return `<span class="${cls(BADGE_BASE, BADGE_VARIANT[variant])}"${t}>${esc(text)}</span>`;
    }
    function ProgressBar(percent, variant) {
      const v = COMPLETION_VARIANT[variant];
      return `<div class="h-1 w-full rounded-full bg-[#1c2431] overflow-hidden" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><div class="${cls("h-full rounded-full transition-[width]", v.bar)}" style="width:${percent}%"></div></div>`;
    }
    function CompletionBadge(stats) {
      const variant = completionClass(stats.percent);
      const v = COMPLETION_VARIANT[variant];
      return `<span class="flex items-center gap-2 shrink-0"><span class="${cls("font-mono text-xs font-semibold tabular-nums", v.text)}">${stats.percent}%</span><span class="${MUTED} font-mono text-[11px]">${stats.completed}/${stats.total}</span></span>`;
    }
    function Button({ label, dataset = {}, className = BUTTON }) {
      const attrs = Object.entries(dataset)
        .map(([k, v]) => ` data-${esc(k)}="${esc(v)}"`)
        .join("");
      return `<button type="button" class="${esc(className)}"${attrs}>${esc(label)}</button>`;
    }
    function Notice(kind, items) {
      if (!items.length) return "";
      const tone = kind === "error" ? "text-rose-300 border-rose-900/50 bg-rose-950/30" : "text-amber-200/90 border-amber-900/50 bg-amber-950/20";
      const label = kind === "error" ? `Errors (${items.length})` : `Warnings (${items.length})`;
      return `<div class="${cls("text-[11px] sm:text-[12px] font-mono border rounded-lg px-2.5 py-2 my-2 break-words", tone)}"><div class="font-semibold mb-0.5">${label}</div>${items.map(item => `<div>• ${esc(item)}</div>`).join("")}</div>`;
    }

    // ============== task components ==============
    // Mirrors CLI eligibility: phase order first, then pre_request (a failed dep means stuck, not just waiting).
    function TaskBadge(task, ctx) {
      if (task.status !== "todo") return "";
      if (ctx.phaseState === "waiting") return Badge("waiting", "waiting phase", `Starts after ${ctx.current} is completed`);
      const unmet = list(task.pre_request).filter(id => ctx.statusById.get(id) !== "completed");
      if (!unmet.length) return list(task.pre_request).length
        ? Badge("ready", "ready", "All pre_request deps completed")
        : Badge("parallel", "parallel", "No pre_request dependencies");
      const failed = unmet.filter(id => ctx.statusById.get(id) === "fail");
      if (failed.length) return Badge("stuck", `stuck: ${failed.join(", ")} failed`, `Blocked by failed task(s): ${failed.join(", ")}. Reset or retry them.`);
      return Badge("blocked", `waiting ${unmet.join(", ")}`, `Waiting on pre_request: ${unmet.join(", ")}`);
    }
    function TaskSummary(task, ctx) {
      const dot = `<span class="${cls("inline-block w-1.5 h-1.5 rounded-full shrink-0", TASK_DOT[task.status])}"></span>`;
      const wave = ctx.wave[task.id] ? Badge("wave", `W${ctx.wave[task.id]}`, `Wave ${ctx.wave[task.id]} of this phase`) : "";
      const agent = task.agent ? Badge("agent", task.agent, "Agent role hint") : "";
      return `<span class="flex items-center gap-2 min-w-0 w-full"><span class="font-mono text-[10.5px] sm:text-[11px] text-[#5b6577] shrink-0">${esc(task.id)}</span><span class="truncate text-[13px] sm:text-[13.5px] text-[#dde3ec]">${esc(task.title)}</span></span><span class="flex flex-wrap items-center gap-1.5 mt-1 sm:mt-0 sm:justify-end">${dot}<span class="${cls(MUTED, "font-mono text-[11px]")}">${esc(task.status)}</span>${wave}${agent}${TaskBadge(task, ctx)}</span>`;
    }
    function TaskBody(task) {
      const deps = list(task.pre_request);
      const files = list(task.files);
      const meta = [
        deps.length ? `<div class="${META}">pre_request: ${deps.map(esc).join(", ")}</div>` : "",
        task.agent ? `<div class="${META}">agent: ${esc(task.agent)}</div>` : "",
        files.length ? `<div class="${META} break-all"><span>files:</span><ul class="mt-0.5 pl-3 list-disc marker:text-[#3d4757] space-y-0.5">${files.map(file => `<li>${esc(file)}</li>`).join("")}</ul></div>` : "",
      ].join("");
      const section = (label, body) => `<section class="mt-2"><div class="text-[#6d7889] text-[10.5px] font-semibold tracking-wide">${label}</div><div class="text-[12px] sm:text-[13px] text-[#b7c0cc] leading-snug mt-1 whitespace-pre-wrap break-words">${esc(body)}</div></section>`;
      return `<div class="task-body pt-2 pl-[1px]">${meta}${section("Detail", task.detail)}${ProgressSection(task.progress)}</div>`;
    }
    // One list item per entry: timestamp on its own muted line, evidence indented beneath it.
    function ProgressSection(text) {
      const entries = progressEntries(text);
      if (!entries.length) return "";
      const items = entries.map(entry => `<li class="pl-0.5">${entry.stamp ? `<div class="${META} break-all">[${esc(entry.stamp)}]</div>` : ""}<div class="text-[12px] sm:text-[13px] text-[#b7c0cc] leading-snug whitespace-pre-wrap break-words">${esc(entry.text)}</div></li>`).join("");
      return `<section class="mt-2"><div class="text-[#6d7889] text-[10.5px] font-semibold tracking-wide">Progress</div><ul class="mt-1 list-disc pl-4 space-y-1.5 marker:text-[#3d4757]">${items}</ul></section>`;
    }
    function TaskRow({ task, ctx, key }) {
      const openAttr = isOpen(key, false) ? " open" : "";
      return `<details class="${cls(TASK_BASE, TASK_BORDER[task.status])}" data-key="${esc(key)}"${openAttr}><summary class="cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-0.5 sm:gap-2 py-0.5">${TaskSummary(task, ctx)}</summary>${TaskBody(task)}</details>`;
    }

    // ============== phase components ==============
    function PhaseExecPrompt(planName, phaseName) {
      return `Execute ${planName} only Phase ${phaseName} using Project-Plan-Manager skill. Phases are sequential; tasks with empty pre_request are parallel-eligible. Act as orchestrator: dispatch each ppm task_ready task to a sub agent matching its agent hint, verify, then mark status.`;
    }
    function PhaseAuditPrompt(planName, phaseName) {
      return `Audit ${planName} only Phase ${phaseName} using Project-Plan-Manager skill. Report briefly`;
    }
    function PhaseActions(plan, phase) {
      return `<div class="flex flex-wrap gap-2 items-center my-2">${Button({ label: "Execute Phase", className: BUTTON_PRIMARY, dataset: { prompt: PhaseExecPrompt(plan.name, phase.name) } })}${Button({ label: "Audit Phase", dataset: { prompt: PhaseAuditPrompt(plan.name, phase.name) } })}</div>`;
    }
    function matches(task, query) {
      return [task.id, task.title, task.detail, task.progress, task.status, task.agent, ...list(task.files)]
        .some(value => String(value || "").toLowerCase().includes(query));
    }
    function PhaseSection({ plan, phase, query, projectId, current }) {
      const tasks = phase.tasks.filter(t => !query || matches(t, query));
      if (query && !tasks.length) return "";
      const phaseStats = stats([phase]);
      const variant = completionClass(phaseStats.percent);
      const names = plan.phases.map(p => p.name);
      const phaseState = phase.name === current ? "current" : (current && names.indexOf(phase.name) > names.indexOf(current) ? "waiting" : "done");
      const ctx = { statusById: new Map(phase.tasks.map(t => [t.id, t.status])), wave: phase.wave || {}, phaseState, current };
      const key = `${projectId}/${plan.name}/${phase.name}`;
      // Default: current phase open, others collapsed; searching opens matches.
      const openAttr = (query || isOpen(key, phaseState === "current")) ? " open" : "";
      const errors = list(phase.errors), warnings = list(phase.warnings);
      const issueBadges = (errors.length ? Badge("stuck", `${errors.length} error${errors.length === 1 ? "" : "s"}`) : "") + (warnings.length ? Badge("blocked", `${warnings.length} warn`) : "");
      const stateBadge = phaseState === "current" ? Badge("current", "current") : phaseState === "waiting" ? Badge("waiting", "waiting") : "";
      const waveCount = Math.max(0, ...Object.values(ctx.wave));
      const critical = list(phase.criticalPath);
      const schedule = phase.tasks.length ? `<div class="${META} mt-1 break-words">${waveCount} wave${waveCount === 1 ? "" : "s"} · critical path: ${critical.map(esc).join(" → ") || "—"}</div>` : "";
      const summary = `<summary class="cursor-pointer flex gap-2 items-start">${CHEVRON}<div class="min-w-0 mr-auto"><strong class="block text-[13px] sm:text-[14px] font-semibold ${titleClass(phaseStats.percent)} truncate">${esc(phase.title)}</strong><div class="flex flex-wrap items-center gap-1.5 mt-0.5"><span class="${META}">${esc(phase.name)}</span>${stateBadge}${issueBadges}</div></div>${CompletionBadge(phaseStats)}</summary>`;
      const body = `<div class="pt-2">${ProgressBar(phaseStats.percent, variant)}${schedule}${Notice("error", errors)}${Notice("warning", warnings)}${PhaseActions(plan, phase)}${tasks.map(t => TaskRow({ task: t, ctx, key: `${key}/${t.id}` })).join("") || `<span class="${MUTED}">No tasks</span>`}</div>`;
      return `<details data-key="${esc(key)}"${openAttr} class="bg-[#0d1218] border border-[#1c2431] rounded-lg p-2.5 sm:p-3.5 min-w-0">${summary}${body}</details>`;
    }

    // ============== plan components ==============
    function PlanExecPrompt(planName) {
      return `Execute ${planName} using Project-Plan-Manager skill`;
    }
    function PlanAuditPrompt(planName) {
      return `Audit ${planName} using Project-Plan-Manager skill`;
    }
    function PlanActions(plan) {
      return `<div class="flex flex-wrap gap-2 items-center my-2.5 sm:my-3">${Button({ label: "Execute Plan", className: BUTTON_PRIMARY, dataset: { prompt: PlanExecPrompt(plan.name) } })}${Button({ label: "Audit Plan", dataset: { prompt: PlanAuditPrompt(plan.name) } })}${Button({ label: "Open plan.md", dataset: { plan: plan.name } })}</div>`;
    }
    function PlanHeading(plan, percent) {
      return `<span class="flex flex-col gap-0.5 min-w-0 mr-auto"><span class="text-[14px] sm:text-[15px] font-semibold ${titleClass(percent)} truncate">${esc(plan.name)}</span><span class="text-[#6d7889] text-[10.5px] sm:text-[11.5px] font-normal font-mono">created ${esc(plan.createdAt || "—")} · updated ${esc(plan.lastUpdated || "—")}</span></span>`;
    }
    function Plan({ plan, planStats, projectId, query }) {
      const current = currentPhaseName(plan);
      const phaseSections = plan.phases
        .map(phase => PhaseSection({ plan, phase, query, projectId, current }))
        .filter(Boolean);
      if (query && !phaseSections.length) return "";
      const variant = completionClass(planStats.percent);
      const planKey = `${projectId}/${plan.name}`;
      const openAttr = (query || isOpen(planKey, false)) ? " open" : "";
      const issues = list(plan.errors).length + plan.phases.reduce((sum, p) => sum + list(p.errors).length, 0);
      const issueBadge = issues ? Badge("stuck", `${issues} error${issues === 1 ? "" : "s"}`, "plan_validate would fail") : "";
      return `<details data-key="${esc(planKey)}"${openAttr} class="bg-[#111720] border border-[#232b38] rounded-xl p-2"><summary class="cursor-pointer flex gap-2 sm:gap-3 items-start">${CHEVRON}${PlanHeading(plan, planStats.percent)}<span class="flex flex-col items-end gap-1 sm:gap-1.5 shrink-0">${CompletionBadge(planStats)}<span class="flex items-center gap-1.5">${issueBadge}<span class="${MUTED} text-[11px]">${plan.phases.length} phase${plan.phases.length === 1 ? "" : "s"}</span></span></span></summary><div class="pl-0 sm:pl-[22px] pt-1"><div class="mb-1">${ProgressBar(planStats.percent, variant)}</div>${Notice("error", list(plan.errors))}${PlanActions(plan)}<div class="grid gap-2 sm:gap-3 grid-cols-1 md:grid-cols-[repeat(auto-fit,minmax(340px,1fr))] items-start">${phaseSections.join("") || `<span class="${MUTED}">No phases</span>`}</div></div></details>`;
    }

    // ============== render ==============
    function render() {
      // Search force-opens matches; don't persist that as the user's accordion state.
      if (!state.renderedQuery) rememberAccordions();
      state.renderedQuery = state.query.trim();
      const projects = state.data?.projects || [];
      const select = document.querySelector("#project");
      const previous = state.project || select.value;
      select.innerHTML = projects.map(p => `<option value="${esc(p.id)}">${esc(p.name)} — ${esc(p.path)}</option>`).join("");
      state.project = projects.some(p => p.id === previous) ? previous : (projects[0]?.id || "");
      select.value = state.project;
      const project = projects.find(p => p.id === state.project);
      if (!project) { document.querySelector("#content").innerHTML = `<div class="text-[#8996a8] text-sm border border-dashed border-[#232b38] rounded-lg p-6 text-center">No registered projects. Run <code class="font-mono text-teal-300 bg-[#161d27] px-1.5 py-0.5 rounded">ppm init</code>.</div>`; return; }
      if (project.error) { document.querySelector("#content").innerHTML = `<p class="text-rose-300 text-sm border border-rose-900/50 bg-rose-950/30 rounded-lg p-3.5">${esc(project.error)}</p>`; return; }
      const query = state.query.trim().toLowerCase();
      const plans = project.plans
        .map(plan => ({ plan, planStats: stats(plan.phases) }))
        .filter(({ planStats }) => state.filter === "all" || completionClass(planStats.percent) === state.filter)
        .sort((a, b) => byCompletion(a.planStats, b.planStats))
        .map(({ plan, planStats }) => Plan({ plan, planStats, projectId: project.id, query }))
        .filter(Boolean)
        .join("");
      document.querySelector("#content").innerHTML = plans || `<div class="text-[#8996a8] text-sm border border-dashed border-[#232b38] rounded-lg p-6 text-center">No plans found.</div>`;
    }
    async function load() {
      try {
        const response = await fetch("/api/tasks", { cache:"no-store" });
        if (!response.ok) throw new Error(await response.text());
        state.data = await response.json();
        render();
      } catch (error) {
        document.querySelector("#content").innerHTML = `<p class="text-rose-300 text-sm border border-rose-900/50 bg-rose-950/30 rounded-lg p-3.5">${esc(error.message)}</p>`;
      }
    }

    // ============== event handlers ==============
    document.querySelector("#project").addEventListener("change", event => { state.project = event.target.value; render(); });
    document.querySelector("#plan-filter").addEventListener("change", event => { state.filter = event.target.value; render(); });
    document.querySelector("#search").addEventListener("input", event => { state.query = event.target.value; render(); });
    document.querySelector("#refresh").addEventListener("click", load);
    document.querySelector("#content").addEventListener("click", async event => {
      const openButton = event.target.closest("[data-plan]");
      if (openButton) {
        const project = state.data.projects.find(item => item.id === state.project);
        const plan = project?.plans.find(item => item.name === openButton.dataset.plan);
        document.querySelector("#modal-title").textContent = `${plan?.name || "Plan"} — plan.md`;
        document.querySelector("#modal-content").textContent = plan?.content || "plan.md not found or empty.";
        document.querySelector("#plan-modal").showModal();
        return;
      }
      const button = event.target.closest("[data-prompt]");
      if (!button) return;
      const label = button.textContent;
      try {
        await navigator.clipboard.writeText(button.dataset.prompt);
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = label; }, 1200);
      } catch { window.prompt("Copy prompt:", button.dataset.prompt); }
    });
    document.querySelector("#modal-close").addEventListener("click", () => document.querySelector("#plan-modal").close());
    document.querySelector("#plan-modal").addEventListener("click", event => { if (event.target === event.currentTarget) event.currentTarget.close(); });
    load(); setInterval(load, 3000);
  </script>
</body>
</html>
